{{ define "main" }}
{{/* Single note: date is the headline (notes usually have no title). */}}
<article class="max-w-prose">
  <div class="mt-5 text-sm text-neutral-500 dark:text-neutral-400">
    <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "January 2, 2006" }}</time>
    {{ if .Title }}<span class="mx-1">&middot;</span>{{ .Title }}{{ end }}
    <span class="mx-1">&middot;</span><a href="{{ .Parent.RelPermalink }}" class="hover:underline">all notes</a>
  </div>
  <div class="mt-2 prose dark:prose-invert">
    {{ .Content }}
  </div>
</article>
{{ end }}
