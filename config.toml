baseURL = "https://miroadamy.com/"
locale = "en"
defaultContentLanguage = "en"
title = "Miro's World"
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false
theme = "blowfish"

# vpub notes stream: frontmatter-free files take their date from the filename
# (YYYY-MM-DD-slug.md). "date" stays first so every page that HAS a date field
# (all legacy posts, /now) keeps it exactly as written.
[frontmatter]
  date = ["date", ":filename", ":default"]

[pagination]
  pagerSize = 10

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# Blowfish search: client-side index needs the JSON output on home
[outputs]
  home = ["HTML", "RSS", "JSON"]

[[menu.main]]
  name = "Home"
  weight = 10
  identifier = "home"
  url = "/"
[[menu.main]]
  name = "Archives"
  weight = 20
  identifier = "archives"
  url = "/posts/"
[[menu.main]]
  name = "Tags"
  weight = 30
  identifier = "tags"
  url = "/tags/"
[[menu.main]]
  name = "Categories"
  weight = 40
  identifier = "categories"
  url = "/categories/"

[params]
  colorScheme = "blowfish"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  # All 555 posts carry WordPress-era `type: post`, so section-based defaults
  # ("posts") match nothing — this key is REQUIRED for any list page to fill.
  mainSections = ["post"]
  keywords = ["blog", "Miro"]
  description = "Miro's World - personal blog of Miro Adamy"

  [params.header]
    layout = "basic"

  [params.homepage]
    layout = "profile"
    showRecent = true
    showRecentItems = 10

  [params.article]
    showDate = true
    showAuthor = false
    showPagination = true          # prev/next chaining between posts
    showTableOfContents = true
    showReadingTime = true
    showWordCount = true
    showTaxonomies = true
    showBreadcrumbs = false
    showEdit = false

  [params.list]
    showSummary = true
    groupByYear = true             # year-grouped archives
    showTableOfContents = false
    cardView = false

  [params.author]
    name = "Miro Adamy"
    headline = "Miro's World — personal blog, est. 2006"
    links = [
      { email = "mailto:miro.adamy@gmail.com" },
      { linkedin = "https://www.linkedin.com/in/miroadamy/" },
      { stack-overflow = "https://stackoverflow.com/users/369692/miro-a" },
      { github = "https://github.com/miroadamy" },
      { gitlab = "https://gitlab.com/miro.adamy" },
      { x-twitter = "https://twitter.com/miroadamy" },
      { facebook = "https://www.facebook.com/miro.adamy" },
      { instagram = "https://www.instagram.com/miro.adamy/?hl=sk" },
    ]

# See https://gohugo.io/about/hugo-and-gdpr/
[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
  [privacy.youtube]
    privacyEnhanced = true

# --- Compatibility with modern Hugo (added 2026-07-07 for blog revival) ---

# This blog has ~385 legacy WordPress-export posts as raw .html content files.
# Hugo >=0.16x blocks text/html content by default (security.allowContent =
# ['! ^text/html$']). Allow all content media types so .html posts build.
[security]
  allowContent = ['.*']

# Legacy WordPress-export posts embed raw HTML inside Markdown (and the .html posts
# ARE raw HTML). Modern Hugo/Goldmark strips raw HTML by default; this restores it.
[markup.goldmark.renderer]
  unsafe = true

# Blowfish syntax highlighting uses its own CSS classes, not inline styles.
[markup.highlight]
  noClasses = false

# Blowfish table-of-contents depth
[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
